// ---------------------------------------------------------------------------
// Half-Life software-OpenGL speed config for the Quadro NVS 140M native driver
// (guipimenta/quadronvs140m-9x). OpenGL here is rendered on the CPU by Mesa
// llvmpipe - Windows 98 uses only one CPU core - so frame rate is set mostly
// by the screen resolution and by how much per-pixel work each frame does.
// These settings trade visual quality for speed. Delete valve\autoexec.cfg to
// return to defaults. Lines you do not want: put // in front of them.
//
// BIGGEST lever is NOT in this file: pick a low OpenGL resolution in
//   Options -> Video -> Video modes -> OpenGL (Default driver).
//   640x480 ~ baseline, 512x384 ~ 1.5x faster, 400x300 ~ 2.5x, 320x240 ~ 4x.
// ---------------------------------------------------------------------------

gl_texturemode GL_NEAREST_MIPMAP_NEAREST  // point sampling, not bilinear - large texture-side win
r_dynamic 0                                // stop re-lighting world surfaces every frame - large win
gl_dither 0                                // no dithering
gl_picmip 1                                // half-size world textures (less bandwidth, better CPU cache); 2 or 3 = faster, blurrier
gl_round_down 3                            // round texture sizes down
gl_playermip 2                             // low-res player-model textures
gl_keeptjunctions 0                        // fewer triangles on world geometry
gl_wateramp 0                              // flat water (no vertex ripple)
gl_overbright 0
r_decals 50                                // fewer bullet/blood decals kept (default 300); 0 disables
r_mmx 1
gl_ztrick 1                                // skip the per-frame depth-buffer clear; if you see flicker set this to 0

echo "nvspeed: software-OpenGL speed config loaded"
