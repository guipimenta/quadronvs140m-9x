[Display]
; nvmini.drv (native G86 backend): the only mode the backend accepts is
; 1024x768 at 16 bpp. The mode normally comes from the registry
; (HKLM\Config\0001\Display\Settings, set by nvsetup.reg); these values
; are the fallback if that lookup fails.
; NEVER put IgnoreRegistry=1 here: the Win98 VDD reads that key too
; (VDD_PNP_Load_MiniVDD) and then does not load the mini-VDD at all, so
; nvmini.vxd is absent, nvmini.drv fails DriverInit and you get vga.drv.
x_resolution=1024
y_resolution=768
bpp=16
Mmio=0
SwCursor=1

